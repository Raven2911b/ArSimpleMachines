pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'ArSimpleMachines'

include ':ARLib'
project(':ARLib').projectDir = file('../marvins-minecraft-mods/ARLib')
include ':AdvRocketry'
project(':AdvRocketry').projectDir = file('../marvins-minecraft-mods/AdvRocketry')

